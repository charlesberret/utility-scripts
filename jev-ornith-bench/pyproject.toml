[project]
name = "jev-ornith-bench"
version = "0.1.0"
description = "Does Jev's strictness make a local model (Ornith) better at sysadmin and clerical work?"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "openai>=1.40",
    "pydantic>=2.12",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
